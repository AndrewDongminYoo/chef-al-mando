name: Godot checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  m0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up hosted Linux tools
        run: |
          bash setup.sh
          bash setup.sh
          printf 'GODOT_BIN=%s\n' "$(command -v godot)" >> "$GITHUB_ENV"
      - name: Check setup behavior
        run: python3 tests/test_setup.py
      - name: Check M0
        run: bash scripts/check.sh m0
      - name: Check M1
        run: bash scripts/check.sh m1
      - name: Check M2
        run: bash scripts/check.sh m2
      - name: Check M3
        run: bash scripts/check.sh m3
      - name: Check M4 storage core
        run: bash scripts/check.sh m4-core
      - name: Check M4
        run: bash scripts/check.sh m4
      - name: Check M4 process restart
        run: python3 tests/test_m4_restart.py
      - name: Check M5 licenses
        run: bash scripts/check.sh m5
      - name: Check mise suite
        run: bash scripts/check.sh mise
      - name: Check export failure handling
        run: python3 tests/test_export_check.py
      - name: Check iOS export privacy cleanup
        run: python3 tests/test_ios_export.py
      - name: Check exported M1 through M5 and storage core
        run: bash scripts/check-export.sh
