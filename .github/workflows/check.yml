name: Godot checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  m0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Godot
        env:
          GODOT_ARCHIVE: Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          curl --fail --location --retry 2 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$GODOT_ARCHIVE" \
            --output "$RUNNER_TEMP/$GODOT_ARCHIVE"
          echo "$GODOT_SHA256  $RUNNER_TEMP/$GODOT_ARCHIVE" | sha256sum --check
          unzip -q "$RUNNER_TEMP/$GODOT_ARCHIVE" -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Check M0
        run: bash scripts/check.sh m0
